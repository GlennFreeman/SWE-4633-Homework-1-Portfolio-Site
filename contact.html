    <main>
      <!-- Interactive Contact Us Form Wrapper -->
      <form id="sample-form" onsubmit="event.preventDefault()" novalidate>
        <h2>Contact Our Team</h2>
        <p
          style="
            font-size: 13px;
            color: #64748b;
            margin-top: -8px;
            margin-bottom: 20px;
          "
        >
          Have questions? Drop us a line below and we will get back to you
          shortly.
        </p>

        <div class="form-group">
          <label for="username">Full Name *</label>
          <input
            type="text"
            id="username"
            required
            minlength="3"
            placeholder="Jane Doe"
          />
        </div>

        <div class="form-group">
          <label for="useremail">Email Address *</label>
          <input
            type="email"
            id="useremail"
            required
            placeholder="jane@example.com"
          />
        </div>

        <div class="form-group">
          <label for="inquiry-subject">What can we help you with? *</label>
          <select
            id="inquiry-subject"
            required
            style="
              width: 100%;
              padding: 10px;
              border: 1px solid #cbd5e1;
              border-radius: 6px;
              box-sizing: border-box;
              background: white;
            "
          >
            <option value="" disabled selected>Select an option...</option>
            <option value="support">Technical Support</option>
            <option value="billing">Billing & Sales</option>
            <option value="feedback">General Feedback</option>
          </select>
        </div>

        <div class="form-group">
          <label for="user-message">Your Message *</label>
          <textarea
            id="user-message"
            required
            minlength="10"
            rows="4"
            placeholder="Type your message here (minimum 10 characters)..."
            style="
              width: 100%;
              padding: 10px;
              border: 1px solid #cbd5e1;
              border-radius: 6px;
              box-sizing: border-box;
              font-family: sans-serif;
              resize: vertical;
            "
          ></textarea>
        </div>

        <!-- Simulated Server Switcher (For Testing Layouts easily) -->
        <div
          class="form-group network-toggle"
          style="
            background: #f1f5f9;
            padding: 8px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
          "
        >
          <label
            style="
              display: flex;
              align-items: center;
              gap: 8px;
              font-weight: normal;
              cursor: pointer;
            "
          >
            <input type="checkbox" id="simulate-offline" /> Force Server Offline
            (Triggers Warning)
          </label>
        </div>

        <button type="submit">Send Message</button>
      </form>
      <!-- Container slot for incoming alerts -->
