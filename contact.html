    <main>
      <!-- Interactive Contact Us Form Wrapper -->
      <form
        id="contact-form"
        onsubmit="event.preventDefault()"
        novalidate
        class="card"
      >
        <h2>Contact Me!</h2>
        <p>
          Have questions? Drop me a line below and I will get back to you
          shortly.
        </p>
        <section>
          <fieldset>
            <legend>Full Name</legend>
            <input
              type="text"
              id="username"
              required
              minlength="3"
              placeholder="Jane Doe"
            />
          </fieldset>

          <fieldset>
            <legend>Email Address</legend>
            <input
              type="email"
              id="useremail"
              required
              placeholder="example@example.com"
            />
          </fieldset>

          <fieldset>
            <legend>What can we help you with?</legend>
            <select id="inquiry-subject" required>
              <option value="" disabled hidden selected>
                Select an option...
              </option>
              <option value="support">Technical Support</option>
              <option value="comission">Commisions</option>
              <option value="feedback">General Feedback</option>
            </select>
          </fieldset>

          <fieldset>
            <legend>Your Message</legend>
            <textarea
              id="user-message"
              required
              minlength="10"
              placeholder="Type your message here (minimum 10 characters)..."
            ></textarea>
          </fieldset>

          <!-- Simulated Server Switcher (For Testing Layouts easily) -->
          <div class="form-group network-toggle">
            <label
              style="
                display: flex;
                align-items: center;
                gap: 8px;
                font-weight: normal;
                cursor: pointer;
              "
            >
              <input type="checkbox" id="simulate-offline" /> Force Server
              Offline (Triggers Warning)
            </label>
          </div>
        </section>

        <button type="submit" class="button accent">Send Message</button>
      </form>
      <!-- Container slot for incoming alerts -->
      <div id="toast-container"></div>
